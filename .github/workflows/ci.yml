
name: MenuExpress CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python dependencies
        working-directory: menuexpress-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install mobile dependencies
        working-directory: menuexpress-mobile
        run: npm ci

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python dependencies
        working-directory: menuexpress-backend
        run: pip install -r requirements.txt
      - name: Install mobile dependencies
        working-directory: menuexpress-mobile
        run: npm ci
      - name: Check Python syntax
        working-directory: menuexpress-backend
        run: python -m compileall -q .
      - name: Run chatbot unit tests
        working-directory: menuexpress-backend
        run: python manage.py test chatbot
      - name: Check TypeScript
        working-directory: menuexpress-mobile
        run: npx tsc --noEmit

  eval:
    name: Eval
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    defaults:
      run:
        working-directory: menuexpress-backend
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY1 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Gemini evaluation suite
        run: python evaluations/run_eval.py
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrbig-ai-evaluation-results
          path: menuexpress-backend/evaluations/results.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Prepare deployment artifact
        run: echo "All checks passed. Ready for deployment."
